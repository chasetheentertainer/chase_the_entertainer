<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Coffin Chase: Chase the Entertainer Presents</title>
<meta name="description" content="A Manitou Springs walking mystery. Presented by Chase the Entertainer.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#17130f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  /* ---------------------------------------------------------
     DESIGN TOKENS
     ink       — background, near-black warm charcoal
     parchment — card surfaces, aged paper
     bone      — light text on dark surfaces
     oxblood   — Chase's accent (radio, wax seals, headers)
     brass     — secondary accent (borders, dividers, icons)
     spirit    — "unlocked / otherworldly" accent (mineral-glass green)
     malini    — Malini's accent (his card, his hint chips, his glow)
     --------------------------------------------------------- */
  :root{
    color-scheme: dark;
    --progress: 0;
    --ink: #17130f;
    --ink-2: #201a15;
    --parchment: #e9dec2;
    --parchment-2: #f4ecd8;
    --bone: #f4ecd8;
    --oxblood: #6d1f2a;
    --oxblood-2: #8a2c3a;
    --brass: #b8925a;
    --brass-2: #d9b57e;
    --spirit: #5f9c82;
    --ink-text: #2a2015;
    --malini: #d9491f;
    --malini-2: #ff7a3d;
    --shadow: 0 12px 30px rgba(0,0,0,.45);
    --radius: 4px;
    --display: "Fraunces", serif;
    --body: "Spectral", serif;
    --ui: "Work Sans", sans-serif;
    --antique: "Cinzel", serif;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(217,73,31, calc(0.22 - (var(--progress) * 0.08))), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(95,156,130, calc(0.10 + (var(--progress) * 0.28))), transparent 45%),
      var(--ink);
    color: var(--bone);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    min-height:100%;
    transition: background 1.2s ease;
  }

  a{ color: inherit; }

  .coffin-hex{
    clip-path: polygon(38% 6%, 62% 6%, 86% 33%, 70% 94%, 30% 94%, 14% 33%);
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0px, transparent 1px, transparent 2px);
  }

  #app{ position:relative; z-index:1; max-width: 560px; margin: 0 auto; min-height:100vh; display:flex; flex-direction:column; }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px; border-bottom: 1px solid rgba(184,146,90,.25);
    font-family: var(--ui); text-transform: uppercase; letter-spacing: .08em; font-size:.7rem;
  }
  header.topbar.topbar--hidden{ display:none; }
  header.topbar .brand{ opacity:.8; }
  header.topbar .brand b{ color: var(--brass-2); }

  .tray-btn{
    display:flex; align-items:center; gap:8px; background:none; border:1px solid var(--brass);
    color: var(--bone); padding:6px 10px; border-radius: 999px; cursor:pointer; font-family: var(--ui);
    font-size:.72rem; letter-spacing:.05em;
  }
  .tray-btn:hover{ background: rgba(184,146,90,.12); }
  .tray-count{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%; background: var(--oxblood); color:var(--bone);
    font-size:.65rem;
  }

  main{ flex:1; padding: 28px 20px 60px; }

  /* ---------- typography ---------- */
  .eyebrow{
    font-family: var(--ui); text-transform:uppercase; letter-spacing:.22em; font-size:.68rem;
    color: var(--brass-2); margin: 0 0 10px;
  }
  h1.title{
    font-family: var(--display); font-weight:900; font-size: clamp(2.1rem, 9vw, 3.2rem);
    line-height:1.02; margin:0 0 6px; color: var(--bone);
  }
  h1.title em{ color: var(--oxblood-2); font-style: italic; }
  .subtitle{
    font-family: var(--display); font-style: italic; font-weight:600; color: var(--brass-2);
    font-size: 1.05rem; margin: 0 0 26px;
  }
  h2.section-title{
    font-family: var(--display); font-weight:700; font-size:1.5rem; margin: 0 0 4px; color: var(--bone);
  }
  p{ line-height:1.6; color: rgba(244,236,216,.86); }

  .divider{
    height:1px; margin: 22px 0;
    background: linear-gradient(90deg, transparent, rgba(184,146,90,.55), transparent);
  }

  /* ---------- buttons ---------- */
  .btn{
    font-family: var(--ui); font-weight:600; letter-spacing:.03em; font-size:.9rem;
    padding: 13px 22px; border-radius: var(--radius); border: 1px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;
  }
  .btn-primary{ background: var(--oxblood); color: var(--bone); box-shadow: var(--shadow); }
  .btn-primary:hover{ background: var(--oxblood-2); }
  .btn-ghost{ background: transparent; border-color: var(--brass); color: var(--bone); }
  .btn-ghost:hover{ background: rgba(184,146,90,.1); }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn:focus-visible, a:focus-visible, input:focus-visible, .stop-card:focus-visible{
    outline: 2px solid var(--spirit); outline-offset: 2px;
  }

  /* ---------- cassette-deck radio player (Chase only) ---------- */
  .radio-player{
    --lcd: #7dffa0; --lcd-2: #2fae57;
    position:relative;
    background:
      repeating-linear-gradient(100deg, rgba(255,255,255,.025) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, #2a2a2a, #131313 60%, #1c1c1c);
    border: 1px solid #050505; border-radius: 6px;
    padding: 12px 14px 14px; margin: 22px 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), inset 0 1px 12px rgba(0,0,0,.6), var(--shadow);
  }
  .radio-player.playing:not(.scanning){ --lcd: #ff6b6b; --lcd-2: #c22c2c; }
  .radio-player.scanning{ --lcd: #7dffa0; --lcd-2: #2fae57; }

  .cr-top{
    display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;
    font-family: var(--ui); text-transform:uppercase;
  }
  .cr-brand{ font-weight:700; font-size:.82rem; letter-spacing:.03em; color:#e7e2d8; }
  .cr-model{ font-size:.56rem; letter-spacing:.1em; color:rgba(231,226,216,.4); }

  .cr-body{ display:flex; gap:10px; align-items:stretch; }

  .cr-lcd{
    flex:1; min-width:0; border-radius:3px; padding:7px 10px 8px;
    background: linear-gradient(180deg, #182016, #0c110d);
    border: 2px solid #050705; box-shadow: inset 0 2px 8px rgba(0,0,0,.75);
    display:flex; flex-direction:column; gap:5px;
  }
  .cr-lcd-topline{
    display:flex; justify-content:space-between; font-family: var(--ui); font-size:.55rem;
    letter-spacing:.1em; text-transform:uppercase; color: var(--lcd); opacity:.75;
  }
  .cr-freq{
    font-family: 'Share Tech Mono', monospace; font-size: clamp(1.5rem, 7vw, 1.9rem); line-height:1;
    color: var(--lcd); text-shadow: 0 0 7px var(--lcd-2); letter-spacing:.03em;
  }
  .cr-eq{ display:flex; align-items:flex-end; gap:2px; height:14px; }
  .cr-eq .seg{
    flex:1; min-width:0; height:20%; border-radius:1px;
    background: var(--lcd); box-shadow: 0 0 4px var(--lcd-2);
    opacity:.3; transition: height .3s ease, opacity .3s ease;
  }
  .radio-player.playing .cr-eq .seg{ opacity:1; }

  .cr-controls{ display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:6px; }
  .cr-play{
    width:44px; height:36px; border-radius:4px; cursor:pointer; flex-shrink:0;
    background: linear-gradient(180deg, #4a4a4a, #262626);
    border: 1px solid #050505; border-top-color:#5c5c5c;
    color:#e7e2d8; font-size:.85rem;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 2px rgba(0,0,0,.5);
  }
  .cr-play:active{ box-shadow: inset 0 2px 3px rgba(0,0,0,.6); }
  .radio-player.playing .cr-play{ color: var(--lcd); text-shadow: 0 0 6px var(--lcd-2); }
  .cr-deco{
    width:44px; height:15px; border-radius:2px; background: linear-gradient(180deg, #3c3c3c, #202020);
    border: 1px solid #050505; border-top-color:#4c4c4c;
  }

  .cr-presets{ display:flex; gap:4px; margin-top:9px; }
  .cr-preset{
    flex:1; height:14px; border-radius:2px; background: linear-gradient(180deg, #3c3c3c, #232323);
    border: 1px solid #050505; border-top-color:#4c4c4c;
  }

  @keyframes onAirFlicker{ 0%,100%{ opacity:1; } 92%{ opacity:1; } 94%{ opacity:.4; } 96%{ opacity:1; } }
  .radio-player.playing .cr-lcd-topline .cr-st{
    animation: onAirFlicker 2.4s steps(1,end) infinite;
  }

  @keyframes eqRolling{ 0%,100%{ height:16%; } 30%{ height:80%; } 55%{ height:35%; } 80%{ height:65%; } }
  @keyframes eqBreathe{ 0%,100%{ height:12%; } 50%{ height:55%; } }

  .radio-player.playing.anim-rolling .seg{ animation: eqRolling 1.1s ease-in-out infinite; }
  .radio-player.playing.anim-rolling .seg:nth-child(1){ animation-delay:0s; }
  .radio-player.playing.anim-rolling .seg:nth-child(2){ animation-delay:.07s; }
  .radio-player.playing.anim-rolling .seg:nth-child(3){ animation-delay:.14s; }
  .radio-player.playing.anim-rolling .seg:nth-child(4){ animation-delay:.21s; }
  .radio-player.playing.anim-rolling .seg:nth-child(5){ animation-delay:.28s; }
  .radio-player.playing.anim-rolling .seg:nth-child(6){ animation-delay:.21s; }
  .radio-player.playing.anim-rolling .seg:nth-child(7){ animation-delay:.14s; }
  .radio-player.playing.anim-rolling .seg:nth-child(8){ animation-delay:.07s; }
  .radio-player.playing.anim-rolling .seg:nth-child(9){ animation-delay:0s; }

  .radio-player.playing.anim-breathe .seg{ animation: eqBreathe 2.6s ease-in-out infinite; }
  .radio-player.playing.anim-breathe .seg:nth-child(1){ animation-delay:0s; }
  .radio-player.playing.anim-breathe .seg:nth-child(2){ animation-delay:.18s; }
  .radio-player.playing.anim-breathe .seg:nth-child(3){ animation-delay:.36s; }
  .radio-player.playing.anim-breathe .seg:nth-child(4){ animation-delay:.54s; }
  .radio-player.playing.anim-breathe .seg:nth-child(5){ animation-delay:.72s; }
  .radio-player.playing.anim-breathe .seg:nth-child(6){ animation-delay:.54s; }
  .radio-player.playing.anim-breathe .seg:nth-child(7){ animation-delay:.36s; }
  .radio-player.playing.anim-breathe .seg:nth-child(8){ animation-delay:.18s; }
  .radio-player.playing.anim-breathe .seg:nth-child(9){ animation-delay:0s; }

  @keyframes eqScan{ 0%,100%{ height:12%; } 25%{ height:90%; } 50%{ height:30%; } 75%{ height:70%; } }
  .radio-player.scanning .seg{ animation: eqScan .22s steps(2,end) infinite !important; }
  .radio-player.scanning .seg:nth-child(even){ animation-direction: reverse !important; }

  .radio-tuning{ margin-top:14px; }
  .radio-tuning-track{
    -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px; outline:none; cursor:pointer;
    background: repeating-linear-gradient(90deg, rgba(184,146,90,.5) 0 1px, transparent 1px 9px), rgba(184,146,90,.15);
  }
  .radio-tuning-track::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:10px; height:16px; border-radius:2px;
    background: var(--brass-2); cursor:pointer; margin-top:-5px; box-shadow: var(--shadow);
  }
  .radio-tuning-track::-moz-range-thumb{ width:10px; height:16px; border-radius:2px; background: var(--brass-2); border:none; cursor:pointer; }
  .radio-meta{ display:flex; justify-content:space-between; font-family: var(--ui); font-size:.68rem; color: rgba(244,236,216,.5); margin-top:6px; }
  .radio-label{ font-family: var(--ui); font-size:.66rem; text-transform:uppercase; letter-spacing:.12em; color: var(--brass-2); text-align:center; margin-top:10px; }

  @media (prefers-reduced-motion: reduce){
    .radio-player.playing .cr-lcd-topline .cr-st,
    .radio-player .seg{ animation:none !important; }
    .radio-player.playing .seg{ height:55%; opacity:1; }
  }

  /* ---------- intro screen ---------- */
  .intro-wrap{ text-align:center; padding-top: 10px; }
  .seal-mark{
    width:58px; height:84px; margin: 0 auto 22px;
    display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.5));
  }
  .seal-mark svg{ width:100%; height:100%; }

  /* ---------- map / stop list ---------- */
  .progress-line{
    display:flex; align-items:center; gap:10px; margin-bottom: 22px; font-family: var(--ui);
    font-size:.78rem; color: var(--brass-2); letter-spacing:.04em;
  }
  .progress-bar{ flex:1; height:3px; background: rgba(184,146,90,.2); border-radius:3px; overflow:hidden; }
  .progress-bar > i{ display:block; height:100%; background: var(--spirit); transition: width .4s ease; }

  .stop-list{ display:flex; flex-direction:column; gap:12px; list-style:none; margin:0; padding:0; }
  .stop-card{
    display:flex; align-items:center; gap:14px; padding: 14px; border: 1px solid rgba(184,146,90,.35);
    border-radius: var(--radius); background: rgba(233,222,194,.03); cursor:pointer; text-align:left;
    width:100%; color: inherit; font-family: inherit;
  }
  .stop-card:hover{ border-color: var(--brass); background: rgba(233,222,194,.06); }
  .stop-card.done{ border-color: var(--spirit); background: rgba(95,156,130,.07); }
  .stop-num{
    font-family: var(--display); font-weight:700; font-size:1.1rem; color: var(--brass-2);
    width: 30px; text-align:center; flex-shrink:0;
  }
  .stop-card.done .stop-num{ color: var(--spirit); }
  .stop-info{ flex:1; }
  .stop-name{ font-family: var(--display); font-weight:700; font-size:1.05rem; }
  .stop-meta{ font-family: var(--ui); font-size:.72rem; color: rgba(244,236,216,.55); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
  .stop-check{
    width:22px; height:30px; border: 1px solid var(--brass); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:.7rem;
    background: rgba(184,146,90,.08);
  }
  .stop-card.done .stop-check{ background: var(--spirit); border-color: var(--spirit); color: var(--ink); }
  .stop-card.next{ border-color: var(--brass-2); }
  .stop-card.locked{ opacity:.4; cursor:not-allowed; }
  .stop-card.locked:hover{ border-color: rgba(184,146,90,.35); background: rgba(233,222,194,.03); }
  .stop-card.locked .stop-meta{ font-style: italic; }
  .stop-card.locked .stop-check{ font-size:.6rem; letter-spacing:.02em; }

  /* ---------- stop page: Chase caption + prompt lines ---------- */
  .chase-line{
    font-family: var(--display); font-style: italic; font-size: 1.1rem; line-height:1.55;
    color: var(--bone); border-left: 2px solid var(--oxblood); padding-left:16px; margin: 14px 0 18px;
  }
  .prompt-line{
    font-family: var(--body); font-style: normal; font-weight: 500; font-size: 1.02rem; line-height:1.55;
    color: rgba(244,236,216,.92); border-left: 2px solid var(--brass); padding-left:16px; margin: 14px 0 20px;
  }
  .cue-line{
    font-family: var(--body); font-style: italic; font-size:.92rem; color: rgba(244,236,216,.55);
    margin: 10px 0 0;
  }
  /* the piano cue sits on Malini's parchment card, not the dark screen — needs a dark-on-light variant */
  .malini-card .cue-line{
    color: rgba(42,32,21,.55); margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(42,32,21,.15);
  }

  /* ---------- caption toggle: Chase's spoken lines, hidden by default ---------- */
  .cc-wrap{ text-align:center; margin: 4px 0 6px; }
  .cc-toggle{
    display:inline-flex; align-items:center; gap:7px; background:none; border:1px dashed var(--brass);
    color: var(--brass-2); font-family: var(--ui); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase;
    padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .cc-toggle:hover{ background: rgba(184,146,90,.1); }
  .cc-caret{ font-size:.65rem; display:inline-block; transition: transform .2s ease; }
  .cc-block{ display:none; text-align:left; }
  .cc-block.open{ display:block; animation: growIn .3s ease; }

  input[type=text]{
    width:100%; padding: 13px 14px; font-family: var(--ui); font-size: 1rem;
    background: var(--parchment-2); color: var(--ink-text); border: 1px solid var(--brass);
    border-radius: var(--radius); margin-bottom: 10px;
  }
  .field-row{ display:flex; gap:10px; }
  .field-row .btn{ flex-shrink:0; }

  .feedback{ font-family: var(--ui); font-size:.85rem; margin: 8px 0 4px; min-height: 1.2em; }
  .feedback.bad{ color: #d98a8a; }
  .feedback.good{ color: var(--spirit); }

  .hint-row{ display:flex; gap:8px; flex-wrap:wrap; margin: 14px 0 6px; }
  .hint-chip{
    font-family: var(--ui); font-size:.72rem; padding:7px 12px; border-radius:999px;
    border: 1px dashed var(--brass); background:none; color: var(--brass-2); cursor:pointer;
  }
  .hint-chip:disabled{ opacity:.35; cursor:default; }
  .hint-text{ font-size:.85rem; font-style:italic; color: rgba(244,236,216,.7); margin: 6px 0 0; }

  /* ---------- locked / revealed sections (the "growing page") ---------- */
  .locked-block{ display:none; }
  .locked-block.show{ display:block; animation: growIn .4s ease; }
  @keyframes growIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;} }

  /* ---------- finale tap-through: fades in near the end of the clip ---------- */
  .finale-tap{ opacity:0; pointer-events:none; transition: opacity 1.1s ease; margin-top:22px; }
  .finale-tap.show{ opacity:1; pointer-events:auto; }

  /* ---------- effect / item reveal (wax seal) ---------- */
  .effect-reveal{ text-align:center; padding: 10px 0 6px; }
  .wax-seal{
    position:relative; width:78px; height:104px; margin: 6px auto 18px;
    background: radial-gradient(circle at 35% 22%, var(--oxblood-2), var(--oxblood) 72%);
    border: 3px solid var(--brass-2); display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
  }
  .wax-seal .effect-icon{ width:44%; height:44%; color: var(--brass-2); }
  .wax-seal .effect-icon svg{ width:100%; height:100%; display:block; }
  .wax-seal .letter-badge{
    position:absolute; bottom:9px; right:11px; font-family: var(--display); font-weight:900;
    font-size:.85rem; color: var(--brass-2); opacity:.85;
  }
  .effect-name{ font-family: var(--display); font-weight:700; font-size:1.3rem; margin: 4px 0 8px; }
  .effect-desc{ font-style: italic; color: rgba(244,236,216,.7); max-width: 380px; margin: 0 auto; }

  /* =========================================================
     MALINI'S CARD — the growing card. One per stop, one for the finale.
     A different visual language on purpose: parchment "object" you
     found, versus the dark cassette-radio "channel" Chase speaks through.
     ========================================================= */
  .malini-card-shell{ position:relative; transform: rotate(-0.5deg); filter: drop-shadow(var(--shadow)); margin: 8px 0 6px; }
  .malini-card{
    position:relative;
    background:
      radial-gradient(circle at center, rgba(0,0,0,.05) 1px, transparent 1.4px) 0 0/14px 14px,
      linear-gradient(165deg, var(--parchment-2), var(--parchment) 88%);
    color: var(--ink-text);
    border-radius: 3px; border: 1px solid rgba(42,32,21,.15);
    padding: 22px 20px 24px;
  }
  .malini-card::before{
    content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:15px; height:15px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--malini-2), var(--malini) 75%);
    box-shadow: 0 3px 5px rgba(0,0,0,.55);
  }

  .malini-emblem{ text-align:center; margin: 4px 0 14px; }
  .malini-emblem-row{ display:flex; align-items:center; justify-content:center; gap:2px; }
  .malini-medallion{
    position:relative; width:84px; height:84px; border-radius:50%; flex-shrink:0;
    border: 3px solid var(--brass); box-shadow: 0 0 0 2px var(--parchment-2), 0 0 0 3.5px var(--brass-2), 0 6px 14px rgba(0,0,0,.3);
    overflow:hidden; background: var(--ink);
  }
  .malini-emblem.dark .malini-medallion{

  }
  .malini-emblem.dark{ margin: 4px 0 20px; }
  .malini-medallion img{ width:100%; height:100%; object-fit:cover; transform: scale(1.05); display:block; }
  .malini-nameplate{
    font-family: var(--antique); font-weight:600; font-size:.98rem; letter-spacing:.14em;
    color: var(--oxblood); margin: 8px 0 0; text-transform:uppercase;
  }
  .malini-nameplate .sub{
    display:block; font-family: var(--ui); font-weight:600; font-size:.54rem; letter-spacing:.22em;
    color: var(--brass); margin-top:3px; text-transform:uppercase;
  }

  .malini-card-rule{ height:1px; margin: 4px 0 18px; background: linear-gradient(90deg, transparent, rgba(109,31,42,.35), transparent); }

  .malini-label{
    font-family: var(--antique); font-weight:600; font-size:.64rem; letter-spacing:.16em;
    text-transform:uppercase; color: var(--oxblood); text-align:center; margin: 0 0 10px;
  }
  .malini-question{
    font-family: var(--display); font-style:italic; font-weight:600; font-size:1.12rem;
    line-height:1.5; text-align:center; margin: 0 0 20px; color: var(--ink-text);
  }
  .malini-sincere{
    font-family: var(--display); font-style:italic; font-weight:600; font-size:1.12rem;
    line-height:1.55; text-align:center; margin: 0; color: var(--ink-text);
  }

  .malini-seam{ display:flex; align-items:center; gap:10px; margin: 4px 0 16px; opacity:.5; }
  .malini-seam::before, .malini-seam::after{ content:""; flex:1; height:0; border-top: 1px dashed rgba(42,32,21,.4); }
  .malini-seam span{ font-family: var(--ui); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; color: rgba(42,32,21,.55); }

  .malini-answer-row{ display:flex; gap:8px; margin: 0 0 6px; }
  .malini-answer-row input{
    flex:1; min-width:0; padding: 11px 12px; font-family: 'Share Tech Mono', monospace; font-size:.9rem;
    background: rgba(23,19,15,.06); color: var(--ink-text); border: 1px solid rgba(42,32,21,.3);
    border-radius:2px; margin:0;
  }
  .malini-answer-row input::placeholder{ color: rgba(42,32,21,.4); }
  .malini-answer-row button{
    font-family: var(--ui); font-weight:600; font-size:.8rem; letter-spacing:.02em;
    padding: 10px 15px; border-radius:2px; border:1px solid var(--oxblood); cursor:pointer;
    background: var(--oxblood); color:var(--bone); flex-shrink:0;
  }
  .malini-answer-row button:hover{ background: var(--oxblood-2); }

  .malini-feedback{ font-family: var(--ui); font-size:.76rem; min-height:1.1em; margin: 4px 0 2px; text-align:center; }
  .malini-feedback.bad{ color: var(--oxblood); }
  .malini-feedback.good{ color: #2f6b52; }

  .malini-hint-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin: 14px 0 4px; }
  .malini-hint-chip{
    font-family: var(--ui); font-size:.68rem; padding:7px 12px; border-radius:999px;
    border: 1px dashed var(--malini); background:none; color: var(--malini); cursor:pointer;
  }
  .malini-hint-chip:hover{ background: rgba(217,73,31,.07); }
  .malini-hint-chip:disabled{ opacity:.3; cursor:default; }

  .malini-appended{ display:none; }
  .malini-appended.show{ display:block; animation: growIn .4s ease; }

  .malini-hint-block{ margin: 16px 0 0; padding-top:14px; border-top: 1px solid rgba(42,32,21,.12); }
  .malini-hint-tag{
    font-family: var(--antique); font-weight:600; font-size:.6rem; letter-spacing:.14em;
    text-transform:uppercase; color: var(--malini); margin: 0 0 6px;
  }
  .malini-hint-text{ font-family: var(--body); font-style:italic; font-size:.98rem; line-height:1.55; margin:0; color: var(--ink-text); }

  .malini-correct-block{ margin: 18px 0 0; padding-top:16px; border-top: 1px solid rgba(109,31,42,.2); text-align:center; }
  .malini-correct-mark{
    font-family: var(--antique); font-weight:600; font-size:.68rem; letter-spacing:.16em;
    text-transform:uppercase; color: #2f6b52; margin: 0 0 10px;
  }
  .malini-item-disc{
    width:52px; height:68px; margin: 4px auto 10px; border: 2px solid var(--brass);
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 35% 22%, var(--malini-2), var(--malini) 72%);
    color: var(--bone); box-shadow: 0 4px 10px rgba(0,0,0,.35);
    clip-path: polygon(38% 6%, 62% 6%, 86% 33%, 70% 94%, 30% 94%, 14% 33%);
  }
  .malini-item-disc svg{ width:46%; height:46%; }
  .malini-item-name{ font-family: var(--display); font-weight:700; font-size:1rem; margin: 2px 0 6px; color: var(--ink-text); }
  .malini-item-desc{ font-family: var(--body); font-style:italic; font-size:.88rem; color: rgba(42,32,21,.75); max-width:320px; margin:0 auto; }

  .malini-next-line{
    margin: 18px 0 0; padding-top:14px; border-top: 1px dashed rgba(42,32,21,.2);
    font-family: var(--ui); font-size:.74rem; text-align:center; color: rgba(42,32,21,.62);
  }
  .malini-directions{
    margin: 8px 0 0; font-family: var(--ui); font-size:.72rem; text-align:center; color: rgba(42,32,21,.6);
    line-height:1.5;
  }
  .malini-directions a{ color: var(--oxblood); font-weight:600; text-decoration: underline; }
  .malini-next-line b{ color: var(--oxblood); font-weight:600; }

  .malini-card-back-btn{ text-align:center; margin-top:20px; }

  /* ---------- tray modal: detective's corkboard ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(10,8,6,.72); z-index:20; display:none;
    align-items:flex-end; justify-content:center;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:
      radial-gradient(circle at center, rgba(0,0,0,.4) 1px, transparent 1.6px) 0 0/16px 16px,
      linear-gradient(160deg, #362a1c, #201709);
    border-top: 2px solid var(--brass); border-radius: 16px 16px 0 0;
    max-width: 560px; width:100%; padding: 22px 18px 34px; max-height: 78vh; overflow-y:auto;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }
  .modal h3{ font-family: var(--display); margin: 0 0 4px; }
  .modal .sub{ font-family: var(--ui); font-size:.75rem; color: var(--brass-2); text-transform:uppercase; letter-spacing:.08em; margin-bottom:20px; }

  .effects-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:26px 14px; padding: 6px 4px 4px; }

  .effect-card{
    position:relative; background: var(--parchment-2); color: var(--ink-text);
    border-radius: 3px; padding: 18px 10px 12px; text-align:center;
    box-shadow: 0 8px 16px rgba(0,0,0,.55);
    transform: rotate(var(--tilt, -2deg));
  }
  .effects-grid .effect-card:nth-child(4n+1){ --tilt: -2.5deg; }
  .effects-grid .effect-card:nth-child(4n+2){ --tilt: 1.8deg; }
  .effects-grid .effect-card:nth-child(4n+3){ --tilt: 2.4deg; }
  .effects-grid .effect-card:nth-child(4n+4){ --tilt: -1.6deg; }

  .effect-card::before{
    content:""; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:13px; height:13px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8a5c, var(--malini) 75%);
    box-shadow: 0 2px 4px rgba(0,0,0,.6);
  }
  .effect-card .disc{
    width:44px; height:58px; margin: 4px auto 8px; border: 2px solid var(--brass-2);
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 35% 22%, var(--malini-2), var(--malini) 72%);
    color: var(--bone); box-shadow: 0 3px 8px rgba(0,0,0,.4);
    position:relative;
  }
  .effect-card .disc .effect-icon{ width:52%; height:52%; }
  .effect-card .disc .effect-icon svg{ width:100%; height:100%; display:block; }
  .effect-card .tag{
    position:absolute; top:8px; right:6px; font-family: var(--ui); font-size:.58rem;
    letter-spacing:.05em; text-transform:uppercase; color: var(--oxblood);
    border:1px solid var(--oxblood); padding:1px 5px; border-radius:2px;
    background: rgba(109,31,42,.08); transform: rotate(4deg);
  }
  .effect-card .label{
    font-family: var(--ui); font-size:.66rem; line-height:1.3; color: rgba(42,32,21,.75);
  }

  .effect-card.empty{
    background: rgba(233,222,194,.06); color: rgba(244,236,216,.4);
    box-shadow: 0 6px 12px rgba(0,0,0,.35); border: 1px dashed rgba(184,146,90,.3);
  }
  .effect-card.empty::before{ background: radial-gradient(circle at 35% 30%, #7a6a4e, #4a3f2c 75%); opacity:.6; }
  .effect-card.empty .disc{
    border-style:dashed; border-color: rgba(184,146,90,.35); background: rgba(0,0,0,.15);
    color: rgba(184,146,90,.35); box-shadow:none;
  }
  .effect-card.empty .label{ color: rgba(244,236,216,.45); font-style: italic; }

  .modal-close{ display:block; margin: 24px auto 0; }

  /* ---------- share card ---------- */
  #shareCanvas{ width:100%; border-radius: var(--radius); border:1px solid var(--brass); margin: 18px 0; display:block; }

  .map-footer-links{ display:flex; gap:10px; margin-top:14px; }
  .map-footer-links .btn{ flex:1; }

  /* ---------- resources page ---------- */
  .res-section{ margin: 0 0 28px; }
  .res-section h3{
    font-family: var(--display); font-size:1.05rem; color: var(--brass-2);
    margin: 0 0 4px; letter-spacing:.01em;
  }
  .res-item{ margin: 0 0 16px; }
  .res-item .res-name{ font-weight:600; color: var(--bone); }
  .res-item .res-addr{ font-size:.78rem; color: rgba(244,236,216,.5); margin: 0 0 4px; }
  .res-item p{ margin: 4px 0 0; }
  .res-faq dt{ font-weight:600; color: var(--bone); margin-top:12px; }
  .res-faq dd{ margin: 2px 0 0; color: rgba(244,236,216,.75); }
  .res-cta{
    margin-top: 30px; padding: 18px; border: 1px solid var(--brass); border-radius: var(--radius);
    background: rgba(184,146,90,.05); text-align:center;
  }
  .res-cta .social-row{ display:flex; gap:10px; justify-content:center; margin-top:12px; }

  footer.credit{
    text-align:center; font-family: var(--ui); font-size:.68rem; letter-spacing:.08em;
    text-transform:uppercase; color: rgba(244,236,216,.35); padding: 30px 20px 40px;
  }

  @media (prefers-reduced-motion: reduce){
    .locked-block.show, .malini-appended.show{ animation:none; }
    * { scroll-behavior:auto !important; }
  }
</style>

const STORAGE_KEY = "coffinChaseState_v2";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { completed: {}, items: [] };
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function go(hash){ location.hash = hash; }

function updateTopbar(hash){
  const header = document.getElementById("topbar");
  if(!header) return;
  header.classList.toggle("topbar--hidden", hash === "#intro");
}

/* Safe no-op until a real GA4 Measurement ID is set up top; never throws either way. */
function trackEvent(name, params){
  if(typeof gtag === "function") gtag("event", name, params || {});
}

function render(){
  const hash = location.hash || "#intro";
  const main = document.getElementById("main");
  updateTopbar(hash);

  if(hash === "#intro") return renderIntro(main);
  if(hash === "#map") return renderMap(main);
  if(hash === "#finale") return renderFinale(main);
  if(hash === "#outro") return renderOutro(main);
  if(hash === "#resources") return renderResources(main);

  const stopMatch = hash.match(/^#stop-(.+)$/);
  if(stopMatch){
    const stop = STOPS.find(s => s.id === stopMatch[1]);
    if(stop) return renderStop(main, stop);
  }

  renderIntro(main);
}

/* Chase's spoken lines, printed but hidden behind a toggle — exists for anyone who
   can't play audio out loud (noisy street, phone on silent, hard of hearing), and
   doubles as the only way to read the script before real audio is recorded. Hidden
   by default so reading doesn't become the default way people experience Chase. */
function chaseCaptions(id, lines){
  const isCue = l => /^\[.*\]$/.test(l.trim()) || /^\(.*\)$/.test(l.trim());
  const html = lines.map(l => `<p class="${isCue(l) ? "cue-line" : "chase-line"}">${l}</p>`).join("");
  return `
    <div class="cc-wrap">
      <button type="button" class="cc-toggle" id="ccBtn_${id}" aria-expanded="false" onclick="toggleCaptions('${id}')">
        <span>In Case You Can't Hear Me</span><span class="cc-caret" id="ccCaret_${id}">▾</span>
      </button>
    </div>
    <div class="cc-block" id="cc_${id}">${html}</div>
  `;
}

function toggleCaptions(id){
  const block = document.getElementById("cc_" + id);
  const btn = document.getElementById("ccBtn_" + id);
  const caret = document.getElementById("ccCaret_" + id);
  if(!block) return;
  const isOpen = block.classList.toggle("open");
  if(btn) btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  if(caret) caret.textContent = isOpen ? "▴" : "▾";
}

function renderMap(main){
  const sorted = STOPS.slice().sort((a,b)=>a.order-b.order);
  const doneCount = sorted.filter(s => !!state.completed[s.id]).length;
  const pct = Math.round((doneCount / STOPS.length) * 100);
  const nextStop = sorted.find(s => !state.completed[s.id]);
  const nextOrder = nextStop ? nextStop.order : Infinity;

  const items = sorted.map(stop => {
    const done = !!state.completed[stop.id];
    const isNext = stop.order === nextOrder;
    const locked = !done && !isNext;
    const cls = done ? "done" : isNext ? "next" : "locked";
    const checkContent = done ? "✓" : locked ? "&mdash;" : "";
    const metaText = locked ? `Locked, finish ${sorted[stop.order-2]?.name || "the previous stop"} first` : stop.walkNote;
    const attrs = locked ? `disabled aria-disabled="true"` : `onclick="go('#stop-${stop.id}')"`;
    return `
      <li>
        <button class="stop-card ${cls}" ${attrs}>
          <span class="stop-num">${String(stop.order).padStart(2,"0")}</span>
          <span class="stop-info">
            <span class="stop-name">${stop.name}</span>
            <span class="stop-meta">${metaText}</span>
          </span>
          <span class="stop-check coffin-hex">${checkContent}</span>
        </button>
      </li>
    `;
  }).join("");

  main.innerHTML = `
    <p class="eyebrow">The Route</p>
    <h2 class="section-title">Seven Stops. Seven Items.</h2>
    <p style="margin:-2px 0 18px; font-family:var(--ui); font-size:.78rem; color:rgba(244,236,216,.55); text-transform:uppercase; letter-spacing:.05em;">Start at 01 and follow them in order. Later stops unlock as you go.</p>
    <div class="progress-line">
      <span>${doneCount} / ${STOPS.length} gathered</span>
      <span class="progress-bar"><i style="width:${pct}%"></i></span>
    </div>

    <ul class="stop-list">${items}</ul>

    <div class="divider"></div>
    <button class="btn btn-primary btn-block" ${doneCount < STOPS.length ? "disabled" : ""} onclick="go('#finale')">

    </button>

    <div class="map-footer-links">
      <button class="btn btn-ghost" onclick="go('#resources')">While You're in Manitou</button>
    </div>
  `;
}

function fmtTime(sec){
  if(!isFinite(sec)) return "0:00";
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function toggleRadio(id){
  const audio = document.getElementById(id);
  const player = document.getElementById(id+"Player");
  if(!audio || !player) return;
  if(player.classList.contains("playing")){
    audio.pause();
    stopRadioVisual(id);
  } else {
    audio.play().catch(()=>{});
    startRadioVisual(id);
  }
}

function startRadioVisual(id){
  const player = document.getElementById(id+"Player");
  const icon = document.getElementById(id+"Icon");
  const freqEl = document.getElementById(id+"Freq");
  if(!player) return;
  icon.textContent = "❚❚";
  player.classList.add("playing");

  const doSurf = player.dataset.surf === "true";
  const targetFreq = player.dataset.freq || "88.1";
  clearInterval(player._surfTimer);

  if(doSurf && freqEl){
    player.classList.add("scanning");
    let ticks = 0;
    const maxTicks = 26;
    player._surfTimer = setInterval(()=>{
      ticks++;
      freqEl.textContent = (88.1 + Math.floor(Math.random()*199)/10).toFixed(1);
      if(ticks >= maxTicks){
        clearInterval(player._surfTimer);
        freqEl.textContent = targetFreq;
        player.classList.remove("scanning");
      }
    }, 130);
  } else if(freqEl){
    freqEl.textContent = targetFreq;
  }
}

function stopRadioVisual(id){
  const player = document.getElementById(id+"Player");
  const icon = document.getElementById(id+"Icon");
  if(!player) return;
  icon.textContent = "▶";
  clearInterval(player._surfTimer);
  player.classList.remove("playing", "scanning");
}

function seekRadio(id, val){
  const audio = document.getElementById(id);
  if(!audio || !isFinite(audio.duration)) return;
  audio.currentTime = (val/100) * audio.duration;
}

function wireRadio(id){
  const audio = document.getElementById(id);
  if(!audio) return;
  const seek = document.getElementById(id+"Seek");
  const curEl = document.getElementById(id+"Current");
  const totEl = document.getElementById(id+"Total");

  audio.addEventListener("loadedmetadata", ()=>{ totEl.textContent = fmtTime(audio.duration); });
  audio.addEventListener("ended", ()=>{ stopRadioVisual(id); seek.value = 0; curEl.textContent = "0:00"; });
  audio.addEventListener("timeupdate", ()=>{
    if(isFinite(audio.duration)){
      seek.value = (audio.currentTime / audio.duration) * 100;
      curEl.textContent = fmtTime(audio.currentTime);
    }
  });
  audio.addEventListener("error", ()=>{
    const label = document.getElementById(id+"Label");
    if(label){
      label.innerHTML = `<span style="color:#d98a8a;">Audio file not found. Check that /audio/${audio.src.split("/").pop()} was uploaded.</span>`;
    }
  });
}

function normalize(str){ return (str||"").trim().toLowerCase(); }

function matchesAnswer(val, field){
  const candidates = [field.answer, ...(field.altAnswers || [])].map(normalize);
  return candidates.includes(normalize(val));
}

function showMaliniHint(stopId, level){
  const suffix = "_" + stopId;
  if(level === 1){
    document.getElementById("malHint1Block"+suffix).classList.add("show");
    document.getElementById("malHint1"+suffix).disabled = true;
    document.getElementById("malHint2"+suffix).disabled = false;
  }
  if(level === 2){
    document.getElementById("malHint2Block"+suffix).classList.add("show");
    document.getElementById("malHint2"+suffix).disabled = true;
    document.getElementById("malReveal"+suffix).disabled = false;
  }
  if(level === 3){
    document.getElementById("malRevealBlock"+suffix).classList.add("show");
    document.getElementById("malReveal"+suffix).disabled = true;
  }
}

function completeStop(stopId){
  const stop = STOPS.find(s=>s.id===stopId);
  state.completed[stopId] = true;
  if(!state.items.find(e=>e.stopId===stopId)){
    state.items.push({ stopId, letter: stop.malini.item.letter, name: stop.malini.item.name });
  }
  saveState();
  updateTrayCount();
}

function checkMalini(stopId){
  const stop = STOPS.find(s=>s.id===stopId);
  const suffix = "_" + stopId;
  const val = document.getElementById("malIn"+suffix).value;
  const fb = document.getElementById("malFeedback"+suffix);
  if(matchesAnswer(val, stop.malini)){
    fb.textContent = "That's it.";
    fb.className = "malini-feedback good";
    document.getElementById("malCorrectBlock"+suffix).classList.add("show");
    ["malHint1"+suffix, "malHint2"+suffix, "malReveal"+suffix].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.disabled = true;
    });
    trackEvent("stop_completed", { stop_id: stopId });
    completeStop(stopId);
    const backBtn = document.getElementById("stopBackBtn"+suffix);
    if(backBtn) backBtn.style.display = "block";
  } else {
    fb.textContent = randomMiss(RIDDLE_MISS_LINES);
    fb.className = "malini-feedback bad";
  }
}

/* ---------------------- Séance Items tray ---------------------- */

function updateTrayCount(){
  const count = Object.values(state.completed).filter(Boolean).length;
  document.getElementById("trayCount").textContent = count;
  updateProgressGlow(count);
}

function updateProgressGlow(count){
  const ratio = count / STOPS.length;
  document.documentElement.style.setProperty("--progress", ratio.toFixed(3));
}

let trayLastFocused = null;

function openTray(){
  const grid = document.getElementById("effectsGrid");
  const sortedStops = STOPS.slice().sort((a,b)=>a.order-b.order);
  grid.innerHTML = sortedStops.map(stop=>{
    const has = !!state.completed[stop.id];
    return `
      <div class="effect-card ${has ? "" : "empty"}">
        ${has ? `<span class="tag">${stop.malini.item.letter}</span>` : ""}
        <div class="disc coffin-hex">
          ${has ? `<span class="effect-icon">${itemIconSVG(stop.id)}</span>` : "?"}
        </div>
        <div class="label">${has ? stop.malini.item.name : "Not yet found"}</div>
      </div>
    `;
  }).join("");
  document.getElementById("trayModalSub").textContent =
    `${Object.values(state.completed).filter(Boolean).length} of ${STOPS.length} gathered`;

  trayLastFocused = document.activeElement;
  const modal = document.getElementById("trayModal");
  modal.classList.add("open");
  document.querySelector(".modal-close")?.focus();
  document.addEventListener("keydown", handleTrayEscape);
}
function closeTray(){
  document.getElementById("trayModal").classList.remove("open");
  document.removeEventListener("keydown", handleTrayEscape);
  trayLastFocused?.focus();
}
function handleTrayEscape(e){
  if(e.key === "Escape") closeTray();
}

    </div>
  `;
  wireRadio("finaleRadio1");
  wireFinaleTapThrough();
}

/* Length-agnostic on purpose: fades the tap-through in during the last
   ~8 seconds of whatever the final mixed audio.mp3 turns out to be, via
   timeupdate, with an ended fallback -- so dropping in a re-edited mix
   later never requires touching this code again. */
function wireFinaleTapThrough(){
  const audio = document.getElementById("finaleRadio1");
  const btn = document.getElementById("finaleTapThrough");
  if(!audio || !btn) return;
  const revealNear = 8;
  const maybeReveal = ()=>{
    if(isFinite(audio.duration) && (audio.duration - audio.currentTime) <= revealNear){
      btn.classList.add("show");
    }
  };
  audio.addEventListener("timeupdate", maybeReveal);
  audio.addEventListener("ended", ()=> btn.classList.add("show"));
}

let pendingOutroAutoplay = false;

function finishFinale(){
  const audio = document.getElementById("finaleRadio1");
  if(audio) audio.pause();
  pendingOutroAutoplay = true;
  go("#outro");
}

function drawShareCard(){
  const canvas = document.getElementById("shareCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;

  const paint = ()=>{
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#17130f";
    ctx.fillRect(0,0,w,h);
    const grad = ctx.createRadialGradient(w*0.2,0,0,w*0.2,0,w*0.9);
    grad.addColorStop(0,"rgba(217,73,31,.4)");
    grad.addColorStop(1,"rgba(217,73,31,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);

    ctx.strokeStyle = "#b8925a";
    ctx.lineWidth = 4;
    ctx.strokeRect(30,30,w-60,h-60);

    ctx.textAlign = "center";
    ctx.fillStyle = "#d9b57e";
    ctx.font = "600 26px Work Sans, sans-serif";
    ctx.fillText("CHASE THE ENTERTAINER PRESENTS", w/2, 150);

    ctx.fillStyle = "#f4ecd8";
    ctx.font = "900 74px Fraunces, serif";
    ctx.fillText("THE COFFIN CHASE", w/2, 260);

    ctx.font = "italic 600 32px Fraunces, serif";
    ctx.fillStyle = "#b8925a";
    ctx.fillText("A Manitou Springs Walking Mystery", w/2, 320);

    /* medallion: Malini's portrait, clipped into the circle */
    const mx = w/2, my = 560, mr = 110;
    ctx.save();
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();
    if(CERT_PORTRAIT_IMG.complete && CERT_PORTRAIT_IMG.naturalWidth){
      const iw = CERT_PORTRAIT_IMG.naturalWidth, ih = CERT_PORTRAIT_IMG.naturalHeight;
      const scale = Math.max((mr*2)/iw, (mr*2)/ih);
      const dw = iw*scale, dh = ih*scale;
      ctx.drawImage(CERT_PORTRAIT_IMG, mx-dw/2, my-dh/2, dw, dh);
    } else {
      const sealGrad = ctx.createRadialGradient(mx-30,my-30,10,mx,my,mr);
      sealGrad.addColorStop(0,"#ff8a5c");
      sealGrad.addColorStop(1,"#d9491f");
      ctx.fillStyle = sealGrad;
      ctx.fillRect(mx-mr, my-mr, mr*2, mr*2);
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI*2);
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#d9b57e";
    ctx.stroke();

    /* "7 / 7 ITEMS" ribbon, draped across the bottom of the medallion */
    const ribbonY = my + mr - 6, ribbonW = 260, ribbonH = 46;
    ctx.fillStyle = "#6d1f2a";
    ctx.beginPath();
    ctx.moveTo(mx-ribbonW/2, ribbonY-ribbonH/2);
    ctx.lineTo(mx+ribbonW/2, ribbonY-ribbonH/2);
    ctx.lineTo(mx+ribbonW/2, ribbonY+ribbonH/2);
    ctx.lineTo(mx, ribbonY+ribbonH/2-14);
    ctx.lineTo(mx-ribbonW/2, ribbonY+ribbonH/2);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#d9b57e";
    ctx.stroke();
    ctx.fillStyle = "#f4ecd8";
    ctx.font = "700 26px Work Sans, sans-serif";
    ctx.fillText("7 / 7 ITEMS", mx, ribbonY+9);

    ctx.fillStyle = "#f4ecd8";
    ctx.font = "900 52px Fraunces, serif";
    ctx.fillText("VERIFIED SURVIVOR", w/2, 800);

    ctx.font = "italic 600 30px Fraunces, serif";
    ctx.fillStyle = "#b8925a";
    ctx.fillText("Certificate of Completion", w/2, 845);

    ctx.font = "400 24px Spectral, serif";
    ctx.fillStyle = "rgba(244,236,216,.75)";
    const dateStr = new Date().toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
    ctx.fillText(dateStr, w/2, 890);

    ctx.font = "italic 26px Spectral, serif";
    ctx.fillStyle = "#b8925a";
    wrapText(ctx, "\u201cThe dead rarely explain themselves. Neither, on principle, do I.\u201d – Malini", w/2, 990, w-220, 34);

    ctx.font = "600 22px Work Sans, sans-serif";
    ctx.fillStyle = "#d9b57e";
    ctx.fillText("chasetheentertainer.com  ·  #TheCoffinChase", w/2, h-90);

    const link = document.getElementById("downloadCard");
    link.href = canvas.toDataURL("image/png");
    link.download = "the-coffin-chase-completion-card.png";
    link.style.display = "block";

    const shareBtn = document.getElementById("shareCardBtn");
    if(shareBtn) shareBtn.style.display = "block";
  };

  if(CERT_PORTRAIT_IMG.complete){
    paint();
  } else {
    CERT_PORTRAIT_IMG.onload = paint;
    CERT_PORTRAIT_IMG.onerror = paint;
  }
}

function shareCard(){
  const canvas = document.getElementById("shareCanvas");
  if(!canvas) return;
  canvas.toBlob(async (blob) => {
    if(!blob){ document.getElementById("downloadCard")?.click(); return; }
    const file = new File([blob], "the-coffin-chase-completion-card.png", { type: "image/png" });
    const canUseFileShare = typeof navigator.canShare === "function" && navigator.canShare({ files: [file] });
    if(navigator.share && canUseFileShare){
      try{
        await navigator.share({
          files: [file],
          title: "The Coffin Chase",
          text: "I survived The Coffin Chase, a Manitou Springs walking mystery by Chase the Entertainer.",
        });
        return;
      }catch(e){
        if(e && e.name === "AbortError") return; /* user cancelled the share sheet */
      }
    }
    /* unsupported browser, or share failed for a reason other than cancel: fall back to download */
    document.getElementById("downloadCard")?.click();
  }, "image/png");
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(" ");
  let line = "";
  let lines = [];
  for(let n=0;n<words.length;n++){
    const test = line + words[n] + " ";
    if(ctx.measureText(test).width > maxWidth && n > 0){
      lines.push(line);
      line = words[n] + " ";
    } else {
      line = test;
    }
  }
  lines.push(line);
  const startY = y - ((lines.length-1) * lineHeight)/2;
  lines.forEach((l,i)=> ctx.fillText(l.trim(), x, startY + i*lineHeight));
}
